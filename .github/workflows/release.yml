name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run audit:production
      - run: npm run licenses:check
      - run: npm run runtime-assets:release-check
      - run: node desktop/prepare-driver.mjs
      - run: npm run desktop:pack
      - uses: actions/upload-artifact@v4
        with:
          name: md-studio-windows
          path: release/MD-Studio-Setup-*.exe
          if-no-files-found: error
