name: Build release archive

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Assemble archive
        shell: bash
        run: |
          mkdir minidisc-workspace
          cp -R dist/. minidisc-workspace/
          cp README.md LICENSE NOTICE.md SECURITY.md minidisc-workspace/
          zip -r "minidisc-workspace-${GITHUB_REF_NAME}.zip" minidisc-workspace
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: minidisc-workspace-*.zip
          generate_release_notes: true
